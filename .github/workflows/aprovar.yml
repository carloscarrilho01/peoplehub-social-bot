name: Processar aprovações

on:
  schedule:
    - cron: '*/10 * * * *' # a cada 10 min: lê botões/comandos, publica aprovados e cria sob demanda
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-bot-state
  cancel-in-progress: false

jobs:
  aprovar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Ler decisões, publicar aprovados e criar sob demanda
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
        run: node src/poll.mjs

      - name: Commit artes + estado
        run: |
          git config user.name "peoplehub-social-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts state.json
          if git diff --cached --quiet; then
            echo "Sem mudanças."
          else
            git commit -m "aprovar: estado atualizado [skip ci]"
            git pull --rebase --autostash
            git push
          fi
