name: Gerar posts

on:
  schedule:
    - cron: '0 12 * * 1' # toda segunda 12:00 UTC = 09:00 BRT
  workflow_dispatch:
    inputs:
      feed:
        description: 'Quantos posts de feed'
        default: '1'
      story:
        description: 'Quantos stories'
        default: '1'

permissions:
  contents: write

concurrency:
  group: social-bot-state
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Gerar e enviar ao Telegram
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
        run: node src/generate.mjs --feed "${{ github.event.inputs.feed || '1' }}" --story "${{ github.event.inputs.story || '1' }}"

      - name: Commit artes + estado
        run: |
          git config user.name "peoplehub-social-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts state.json
          if git diff --cached --quiet; then
            echo "Nada a commitar."
          else
            git commit -m "gerar: novos posts pendentes [skip ci]"
            git pull --rebase --autostash
            git push
          fi
